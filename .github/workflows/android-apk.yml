name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# A newer push makes an older build pointless; each build takes close to an hour.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck and router tests
        run: |
          npm run typecheck
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Hezam.0-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
